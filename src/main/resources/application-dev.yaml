# dev(개발) 프로필 설정. ./gradlew bootRun 으로 앱을 실행할 때 쓰인다.
# Settings for the dev (development) profile. Used when running the app with ./gradlew bootRun.
spring:
  datasource:
    # jdbc:h2:./db_dev = 프로젝트 폴더에 db_dev.mv.db 라는 "파일" DB를 만든다.
    # 파일에 저장되므로 앱을 껐다 켜도 데이터가 남는다. 이 파일은 .gitignore 로 Git에서 제외한다.
    # jdbc:h2:./db_dev = a file-based database (db_dev.mv.db) in the project folder.
    # Data is saved to the file, so it survives restarts. The file is excluded from Git via .gitignore.
    url: jdbc:h2:./db_dev
    # H2의 기본 관리자 계정. 개발용이라 비밀번호는 비워 둔다.
    # H2's default admin user. Password left empty because this is for development only.
    username: sa
    password:
    # H2에 연결할 때 쓰는 드라이버 클래스.
    # The driver class used to connect to H2.
    driver-class-name: org.h2.Driver
