<!DOCTYPE html>
<!--
  질문 목록 템플릿. QuestionController.list() 가 "question_list" 를 반환하면 이 파일이 쓰인다.
  layout:decorate="~{layout}": templates/layout.html 의 틀(head, 부트스트랩 등)을 입고, 아래 content 부분만 채운다 (017-01).
  The question list template. Used when QuestionController.list() returns "question_list".
  layout:decorate="~{layout}": wears the frame from templates/layout.html (head, Bootstrap, ...) and fills in only the content part below (017-01).
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <!-- 이 페이지의 제목. 레이아웃의 title-pattern 으로 "질문 목록 | SBB" 가 된다 / Becomes "질문 목록 | SBB" via the layout's title-pattern -->
    <title>질문 목록</title>
</head>
<body>
<!-- 레이아웃의 같은 이름(content) 자리에 들어갈 부분 / The part that goes into the layout's slot of the same name (content) -->
<div layout:fragment="content" class="container my-3">
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!--
          th:each="question, loop : ${questionList}": for 문처럼 하나씩 반복한다. loop 에는 반복 정보(count 등)가 들어 있다.
          th:each="question, loop : ${questionList}": repeats like a for loop. loop holds iteration info (count, etc.).
        -->
        <tr th:each="question, loop : ${questionList}">
            <td th:text="${loop.count}"></td>
            <td>
                <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
            </td>
            <!-- #temporals.format: 날짜를 "2026-11-14 17:16" 형식으로 / formats the date like "2026-11-14 17:16" -->
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
