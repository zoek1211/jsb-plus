<!DOCTYPE html>
<!--
  질문 목록 템플릿. QuestionController.list() 가 "question_list" 를 반환하면 이 파일이 쓰인다.
  The question list template. Used when QuestionController.list() returns "question_list".

  th:로 시작하는 속성은 타임리프가 처리한다. 브라우저에 갈 때는 실제 값으로 바뀌고 th: 속성은 사라진다.
  Attributes starting with th: are processed by Thymeleaf. They're replaced by real values and removed before the page reaches the browser.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>질문 목록</title>
    <!--
      부트스트랩: 미리 만들어진 CSS 디자인 모음. class="table", "btn" 처럼 클래스 이름만 붙이면 모양이 적용된다 (교재 2-14).
      교재는 파일을 내려받아 static 에 넣지만, 여기서는 CDN(인터넷 주소)에서 버전을 고정해 불러온다.
      Bootstrap: a ready-made CSS design kit. Just add class names like "table" or "btn" and the styling applies (book 2-14).
      The book downloads the file into static; here we load a pinned version from a CDN (a public URL).
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<!-- container: 가운데 정렬된 본문 영역, my-3: 위아래 여백 / container: centered content area, my-3: vertical margin -->
<div class="container my-3">
    <table class="table">
        <!-- table-dark: 머리글 줄을 어두운 색으로 / table-dark: dark header row -->
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!--
          th:each="question, loop : ${questionList}": for 문처럼 하나씩 반복한다. loop 에는 반복 정보(count 등)가 들어 있다.
          th:each="question, loop : ${questionList}": repeats like a for loop. loop holds iteration info (count, etc.).
        -->
        <tr th:each="question, loop : ${questionList}">
            <td th:text="${loop.count}"></td>
            <td>
                <!-- 제목을 누르면 상세 화면으로 / Clicking the subject opens the detail page -->
                <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
            </td>
            <!--
              #temporals.format(날짜, 형식): 날짜를 보기 좋은 글자로 바꾼다. 2026-11-14T17:16:54.676 → 2026-11-14 17:16
              #temporals.format(date, pattern): formats a date as readable text. 2026-11-14T17:16:54.676 → 2026-11-14 17:16
            -->
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
