<!DOCTYPE html>
<!--
  질문 목록 템플릿. QuestionController.list() 가 "question_list" 를 반환하면 이 파일이 쓰인다.
  The question list template. Used when QuestionController.list() returns "question_list".

  th:로 시작하는 속성은 타임리프가 처리한다. 브라우저에 갈 때는 실제 값으로 바뀌고 th: 속성은 사라진다.
  Attributes starting with th: are processed by Thymeleaf. They're replaced by real values and removed before the page reaches the browser.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>질문 목록</title>
</head>
<body>
<h1>질문 목록</h1>
<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성일시</th>
    </tr>
    </thead>
    <tbody>
    <!--
      th:each="question : ${questionList}": 자바의 for (Question question : questionList) 와 같다.
      컨트롤러가 model 에 담은 questionList 를 하나씩 꺼내 <tr> 을 반복해서 만든다.
      th:each="question : ${questionList}": the same as Java's for (Question question : questionList).
      Repeats this <tr> for each item in the questionList the controller put into the model.
    -->
    <tr th:each="question : ${questionList}">
        <!--
          th:text="${question.id}": 태그 안의 글자를 이 값으로 바꾼다. question.id 는 question.getId() 를 호출한다.
          th:text="${question.id}": replaces the tag's text with this value. question.id calls question.getId().
        -->
        <td th:text="${question.id}"></td>
        <td>
            <!--
              th:href="@{|/question/detail/${question.id}|}": 링크 주소를 만든다.
              @{...} 는 URL 표현식, |...| 안에서는 문자열과 ${...} 값을 섞어 쓸 수 있다 → /question/detail/1
              th:href="@{|/question/detail/${question.id}|}": builds the link URL.
              @{...} is a URL expression; inside |...| you can mix text and ${...} values → /question/detail/1
            -->
            <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
        </td>
        <td th:text="${question.createDate}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
