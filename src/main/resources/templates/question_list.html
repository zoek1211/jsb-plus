<!DOCTYPE html>
<!--
  질문 목록 템플릿. QuestionController.list() 가 "question_list" 를 반환하면 이 파일이 쓰인다.
  layout:decorate="~{layout}": templates/layout.html 의 틀(head, 부트스트랩 등)을 입고, 아래 content 부분만 채운다 (017-01).
  The question list template. Used when QuestionController.list() returns "question_list".
  layout:decorate="~{layout}": wears the frame from templates/layout.html (head, Bootstrap, ...) and fills in only the content part below (017-01).
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <!-- 이 페이지의 제목. 레이아웃의 title-pattern 으로 "질문 목록 | SBB" 가 된다 / Becomes "질문 목록 | SBB" via the layout's title-pattern -->
    <title>질문 목록</title>
</head>
<body>
<!-- 레이아웃의 같은 이름(content) 자리에 들어갈 부분 / The part that goes into the layout's slot of the same name (content) -->
<div layout:fragment="content" class="container my-3">
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!--
          th:each="question, loop : ${paging}": 이번 페이지의 질문들을 하나씩 반복한다 (Page 도 목록처럼 반복할 수 있다). loop 에는 반복 정보(count 등)가 들어 있다.
          th:each="question, loop : ${paging}": repeats over this page's questions (a Page can be looped like a list). loop holds iteration info (count, etc.).
        -->
        <tr th:each="question, loop : ${paging}">
            <td th:text="${loop.count}"></td>
            <td>
                <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
            </td>
            <!-- #temporals.format: 날짜를 "2026-11-14 17:16" 형식으로 / formats the date like "2026-11-14 17:16" -->
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <!--
      페이징 (교재 3-02). paging.number: 현재 페이지(0부터), paging.totalPages: 전체 페이지 수,
      paging.hasPrevious / hasNext: 이전·다음 페이지가 있는가?
      Paging (book 3-02). paging.number: current page (0-based), paging.totalPages: total pages,
      paging.hasPrevious / hasNext: is there a previous/next page?
    -->
    <div th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <!-- th:classappend: 조건이 참이면 class 를 덧붙인다. 첫 페이지면 "이전"을 비활성화 / th:classappend: adds a class when true. Disable "previous" on the first page -->
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">이전</a>
            </li>
            <!--
              #numbers.sequence(0, 마지막): 0, 1, 2 ... 순서대로 숫자를 만든다.
              th:if: 현재 페이지 앞뒤 5개만 보여준다 (페이지가 30개라도 버튼이 30개 나오지 않게).
              화면에는 사람에게 익숙하게 1부터 보여준다 (page + 1). 교재는 0부터 보여준다.
              #numbers.sequence(0, last): makes the numbers 0, 1, 2 ... in order.
              th:if: shows only 5 pages on each side of the current one (so 30 pages don't make 30 buttons).
              The page shows numbers starting from 1 (page + 1), which is familiar to people. The book shows them from 0.
            -->
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">다음</a>
            </li>
        </ul>
    </div>

    <!-- 질문 등록 화면으로 가는 버튼 (a 태그를 버튼 모양으로) / A link styled as a button that opens the question form -->
    <a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
</div>
</body>
</html>
