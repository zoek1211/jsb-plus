<!DOCTYPE html>
<!--
  질문 목록 템플릿. QuestionController.list() 가 "question_list" 를 반환하면 이 파일이 쓰인다.
  layout:decorate="~{layout}": templates/layout.html 의 틀(head, 부트스트랩 등)을 입고, 아래 content 부분만 채운다 (017-01).
  The question list template. Used when QuestionController.list() returns "question_list".
  layout:decorate="~{layout}": wears the frame from templates/layout.html (head, Bootstrap, ...) and fills in only the content part below (017-01).
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <!-- 이 페이지의 제목. 레이아웃의 title-pattern 으로 "질문 목록 | SBB" 가 된다 / Becomes "질문 목록 | SBB" via the layout's title-pattern -->
    <title>질문 목록</title>
</head>
<body>
<!-- 레이아웃의 같은 이름(content) 자리에 들어갈 부분 / The part that goes into the layout's slot of the same name (content) -->
<div layout:fragment="content" class="container my-3">
    <!--
      위쪽: 질문 등록 버튼(왼쪽) + 검색창(오른쪽) (교재 3-13).
      검색은 GET 폼: 제출하면 /question/list?kw=검색어 로 이동한다. 데이터를 바꾸지 않는 "조회"라서 GET 이 맞다.
      교재는 자바스크립트로 page·kw 숨은 값을 채워 제출하지만, 여기서는 기본 HTML GET 폼과 링크 주소만으로 처리한다.
      Top: the "ask a question" button (left) + the search box (right) (book 3-13).
      Search is a GET form: submitting goes to /question/list?kw=keyword. It only "reads" data, so GET is right.
      The book fills hidden page/kw fields with JavaScript before submitting; here plain HTML GET forms and link URLs do the job.
    -->
    <div class="row my-3">
        <div class="col-6">
            <a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
        </div>
        <div class="col-6">
            <form th:action="@{/question/list}" method="get" class="input-group">
                <!-- th:value="${kw}": 검색 후에도 검색어가 입력칸에 남아 있게 / keeps the keyword in the box after searching -->
                <input type="text" name="kw" class="form-control" th:value="${kw}" placeholder="검색어">
                <button class="btn btn-outline-secondary" type="submit">찾기</button>
            </form>
        </div>
    </div>
    <table class="table">
        <thead class="table-dark">
        <!-- text-center: 가운데 정렬 / text-center: centered -->
        <tr class="text-center">
            <th>번호</th>
            <th style="width:50%">제목</th>
            <th>글쓴이</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!--
          th:each="question, loop : ${paging}": 이번 페이지의 질문들을 하나씩 반복한다 (Page 도 목록처럼 반복할 수 있다). loop 에는 반복 정보(count 등)가 들어 있다.
          th:each="question, loop : ${paging}": repeats over this page's questions (a Page can be looped like a list). loop holds iteration info (count, etc.).
        -->
        <tr th:each="question, loop : ${paging}">
            <!--
              게시물 번호 (교재 3-03): 전체 개수 - (현재 페이지 × 페이지 크기) - 이 페이지 안에서의 순서(0부터)
              예) 전체 302개, 첫 페이지 첫 줄 → 302 - 0 - 0 = 302, 두 번째 페이지 첫 줄 → 302 - 10 - 0 = 292
              loop.count(1부터) 를 쓰면 페이지마다 1~10 이 반복된다 (022-01 화면).
              Post number (book 3-03): total count - (current page × page size) - position within this page (from 0)
              e.g. 302 in total: first row of page 1 → 302 - 0 - 0 = 302; first row of page 2 → 302 - 10 - 0 = 292
              Using loop.count (from 1) repeats 1–10 on every page (as in the 022-01 screen).
            -->
            <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>
            <td>
                <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
                <!--
                  답변 개수 표시 (교재 3-04). 답변이 1개 이상일 때만 제목 옆에 빨간 숫자로.
                  th:if: 조건이 거짓이면 이 태그 자체를 그리지 않는다.
                  Answer count (book 3-04). Shown as a red number next to the subject only when there's at least 1 answer.
                  th:if: if the condition is false, the tag isn't rendered at all.
                -->
                <span class="text-danger small ms-2"
                      th:if="${#lists.size(question.answers) > 0}"
                      th:text="${#lists.size(question.answers)}">
                </span>
            </td>
            <!--
              글쓴이 (교재 3-08). 글쓴이 기능 전에 만든 질문은 author 가 null 이므로 th:if 로 확인 후 출력.
              The author (book 3-08). Questions created before this feature have a null author, so check with th:if first.
            -->
            <td class="text-center"><span th:if="${question.author != null}" th:text="${question.author.username}"></span></td>
            <!-- #temporals.format: 날짜를 "2026-11-14 17:16" 형식으로 / formats the date like "2026-11-14 17:16" -->
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <!--
      페이징 (교재 3-02). paging.number: 현재 페이지(0부터), paging.totalPages: 전체 페이지 수,
      paging.hasPrevious / hasNext: 이전·다음 페이지가 있는가?
      Paging (book 3-02). paging.number: current page (0-based), paging.totalPages: total pages,
      paging.hasPrevious / hasNext: is there a previous/next page?
    -->
    <div th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <!-- th:classappend: 조건이 참이면 class 를 덧붙인다. 첫 페이지면 "이전"을 비활성화 / th:classappend: adds a class when true. Disable "previous" on the first page -->
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/question/list(page=${paging.number - 1}, kw=${kw})}">이전</a>
            </li>
            <!--
              #numbers.sequence(0, 마지막): 0, 1, 2 ... 순서대로 숫자를 만든다.
              th:if: 현재 페이지 앞뒤 5개만 보여준다 (페이지가 30개라도 버튼이 30개 나오지 않게).
              화면에는 사람에게 익숙하게 1부터 보여준다 (page + 1). 교재는 0부터 보여준다.
              #numbers.sequence(0, last): makes the numbers 0, 1, 2 ... in order.
              th:if: shows only 5 pages on each side of the current one (so 30 pages don't make 30 buttons).
              The page shows numbers starting from 1 (page + 1), which is familiar to people. The book shows them from 0.
            -->
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a th:text="${page + 1}" class="page-link" th:href="@{/question/list(page=${page}, kw=${kw})}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/question/list(page=${paging.number + 1}, kw=${kw})}">다음</a>
            </li>
        </ul>
        <!--
          페이지 링크의 @{/question/list(page=..., kw=${kw})}: 괄호 안 값이 ?page=1&kw=... 쿼리 문자열로 붙는다 (033-01).
          kw 를 함께 붙여야 검색 결과의 2페이지로 가도 검색이 유지된다. 한글·공백은 타임리프가 알아서 URL 인코딩한다.
          @{/question/list(page=..., kw=${kw})} in the page links: the values in parentheses become the query string ?page=1&kw=... (033-01).
          Including kw keeps the search when going to page 2 of the results. Thymeleaf URL-encodes Korean text and spaces automatically.
        -->
    </div>
</div>
</body>
</html>
