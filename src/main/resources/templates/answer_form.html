<!DOCTYPE html>
<!--
  답변 수정 폼 (교재 3-09). 제출하면 PUT /answer/modify/{answerId} (th:method="put" → 숨은 _method=put).
  The answer edit form (book 3-09). Submits PUT /answer/modify/{answerId} (th:method="put" → a hidden _method=put).
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>답변 수정</title>
</head>
<body>
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">답변 수정</h5>
    <form th:action="@{|/answer/modify/${answerId}|}" th:method="put" th:object="${answerForm}">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10"></textarea>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
