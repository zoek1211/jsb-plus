<!--
  모든 페이지 위쪽에 나오는 내비게이션 바 (교재 3-01). layout.html 이 th:replace 로 끼워 넣는다.
  The navigation bar at the top of every page (book 3-01). layout.html plugs it in with th:replace.

  navbar-expand-lg: 화면이 넓으면 메뉴를 펼치고, 좁으면(모바일) 햄버거 버튼 안에 접는다.
  navbar-expand-lg: shows the menu on wide screens and folds it into a hamburger button on narrow (mobile) screens.
-->
<nav th:fragment="navbarFragment" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container-fluid">
        <!-- 사이트 이름. 누르면 첫 화면(/ → 질문 목록)으로 / The site name. Clicking goes to the front page (/ → question list) -->
        <a class="navbar-brand" th:href="@{/}">SBB</a>
        <!--
          햄버거 버튼: 좁은 화면에서만 보이고, 누르면 아래 #navbarSupportedContent 메뉴를 펼친다.
          부트스트랩 자바스크립트(layout.html 의 bootstrap.bundle.min.js)가 있어야 동작한다.
          The hamburger button: only shown on narrow screens; clicking expands the #navbarSupportedContent menu below.
          It needs Bootstrap's JavaScript (bootstrap.bundle.min.js in layout.html) to work.
        -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/question/list}">질문 목록</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/signup}">회원가입</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
