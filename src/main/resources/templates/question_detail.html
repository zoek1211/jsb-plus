<!DOCTYPE html>
<!--
  질문 상세 템플릿. QuestionController.detail() 이 model 에 담은 question 하나를 보여준다.
  The question detail template. Shows the single question that QuestionController.detail() put into the model.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>질문 상세</title>
    <!-- 부트스트랩 (설명은 question_list.html) / Bootstrap (explained in question_list.html) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 우리만의 추가 스타일 / Our own extra styles -->
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
<div class="container my-3">
    <!-- 질문 제목. border-bottom: 아래 줄, py-2: 위아래 안쪽 여백 / Question subject. border-bottom: underline, py-2: vertical padding -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>

    <!-- 질문 내용을 카드 모양으로 / The question body as a card -->
    <div class="card my-3">
        <div class="card-body">
            <!-- white-space: pre-line → 입력한 줄바꿈을 그대로 보여준다 / white-space: pre-line → keeps the line breaks the user typed -->
            <div class="card-text" style="white-space: pre-line;" th:text="${question.content}"></div>
            <!-- 작성일시를 오른쪽 아래에 / Created date at the bottom right -->
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
        </div>
    </div>

    <!--
      답변 개수. #lists.size(...) 는 타임리프의 목록 도구로 목록의 크기를 구한다.
      question.answers 는 LAZY 지만 화면을 그리는 동안 DB 연결이 열려 있어(open-in-view) 정상적으로 읽힌다.
      Answer count. #lists.size(...) is Thymeleaf's list utility for getting a list's size.
      question.answers is LAZY, but the database connection stays open while the page renders (open-in-view), so it loads fine.
    -->
    <h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answers)}개의 답변이 있습니다.|"></h5>

    <!-- 답변 하나하나를 카드로 / Each answer as a card -->
    <div class="card my-3" th:each="answer : ${question.answers}">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${answer.content}"></div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
        </div>
    </div>

    <!--
      답변 등록 폼. 제출하면 POST /answer/create/{질문id} 로 content 값을 보낸다.
      form-control: 입력칸 모양, btn btn-primary: 파란 버튼
      The answer form. Submitting sends the content value to POST /answer/create/{question id}.
      form-control: input styling, btn btn-primary: blue button
    -->
    <form th:action="@{|/answer/create/${question.id}|}" method="post" class="my-3">
        <textarea name="content" id="content" rows="10" class="form-control"></textarea>
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
