<!DOCTYPE html>
<!--
  질문 상세 템플릿. QuestionController.detail() 이 model 에 담은 question 하나를 보여준다.
  layout:decorate="~{layout}": 공통 틀(layout.html)을 입는다 (017-01). 부트스트랩·style.css 는 레이아웃에서 불러온다.
  The question detail template. Shows the single question that QuestionController.detail() put into the model.
  layout:decorate="~{layout}": wears the shared frame (layout.html) (017-01). Bootstrap and style.css come from the layout.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>질문 상세</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <!-- 질문 제목 / Question subject -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>

    <!-- 질문 내용 카드. pre-line: 입력한 줄바꿈 유지 / Question body card. pre-line: keeps typed line breaks -->
    <div class="card my-3">
        <div class="card-body">
            <!--
              마크다운 → HTML (032-01, 교재 3-12).
              th:utext: th:text 와 달리 HTML 태그를 글자로 바꾸지 않고 "그대로" 출력한다 (u = unescaped).
              그래서 <strong> 같은 마크다운 결과가 실제 굵은 글씨로 보인다. 위험한 원본 HTML 은 CommonUtil 의 escapeHtml(true) 가 미리 막는다.
              마크다운이 줄바꿈을 <p> 로 처리하므로 white-space: pre-line 은 뺐다.
              Markdown → HTML (032-01, book 3-12).
              th:utext: unlike th:text, prints HTML tags "as-is" instead of escaping them (u = unescaped).
              So Markdown output like <strong> appears as real bold text. Dangerous raw HTML is blocked beforehand by CommonUtil's escapeHtml(true).
              Markdown turns line breaks into <p>, so white-space: pre-line was removed.
            -->
            <div class="card-text" th:utext="${commonUtil.markdown(question.content)}"></div>
            <div class="d-flex justify-content-end">
                <!--
                  수정일시 (029-01). 생성 때도 @LastModifiedDate 가 채워지므로, 생성 후 1초 넘게 지나 바뀐 경우에만 "modified" 로 보여준다.
                  Modified date (029-01). @LastModifiedDate is also filled at creation, so show "modified" only when it changed more than 1 second after creation.
                -->
                <div th:if="${question.modifyDate.isAfter(question.createDate.plusSeconds(1))}"
                     class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <!-- 글쓴이 (028-01, null 이면 생략) / Author (028-01, skipped if null) -->
                    <div class="mb-2"><span th:if="${question.author != null}" th:text="${question.author.username}"></span></div>
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <!--
              수정·삭제 버튼 (029-01). 로그인했고, 글쓴이가 로그인한 사용자일 때만 보인다.
              #authentication.name: 로그인한 사용자 아이디 (sec:authentication="name" 과 같은 값)
              Edit/delete buttons (029-01). Shown only when logged in and the author is the logged-in user.
              #authentication.name: the logged-in username (same value as sec:authentication="name")
            -->
            <!--
              추천 버튼 (교재 3-10). POST 폼 (CSRF 토큰 포함). 버튼 안의 숫자는 추천 수 (#lists.size 는 Set 에도 쓸 수 있다).
              로그인하지 않고 누르면 @PreAuthorize 때문에 로그인 화면으로 간다.
              The recommend button (book 3-10). A POST form (with the CSRF token). The number on the button is the vote count (#lists.size works on a Set too).
              Pressing it without logging in goes to the login page because of @PreAuthorize.
            -->
            <form th:action="@{|/question/vote/${question.id}|}" method="post" class="d-inline-block mt-3">
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                    추천 <span class="badge rounded-pill bg-success" th:text="${#lists.size(question.voter)}"></span>
                </button>
            </form>
            <div class="my-3" sec:authorize="isAuthenticated()"
                 th:if="${question.author != null and question.author.username == #authentication.name}">
                <a th:href="@{|/question/modify/${question.id}|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <!--
                  삭제는 DELETE 요청 폼. th:method="delete" → 숨은 _method=delete + CSRF 토큰.
                  onsubmit 의 confirm(): "정말로 삭제하시겠습니까?" 확인창. 취소하면 return false 로 제출을 막는다.
                  Delete is a DELETE-request form. th:method="delete" → a hidden _method=delete plus the CSRF token.
                  confirm() in onsubmit: an "are you sure?" dialog. Cancel returns false, which stops the submit.
                -->
                <form th:action="@{|/question/delete/${question.id}|}" th:method="delete" class="d-inline"
                      onsubmit="return confirm('정말로 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 답변 개수 (question.answers 는 LAZY, open-in-view 로 화면 그리는 동안 읽힘) / Answer count (LAZY, loaded during rendering via open-in-view) -->
    <h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answers)}개의 답변이 있습니다.|"></h5>

    <!-- 답변 카드 목록 / Answer cards -->
    <!--
      th:id="|answer_${answer.id}|": 각 답변 카드에 answer_4 같은 id 를 붙인다 → 주소 끝의 #answer_4 가 이 위치를 가리킨다 (앵커, 교재 3-11).
      th:id="|answer_${answer.id}|": gives each answer card an id like answer_4 → #answer_4 at the end of a URL points here (anchor, book 3-11).
    -->
    <div class="card my-3" th:each="answer : ${question.answers}" th:id="|answer_${answer.id}|">
        <div class="card-body">
            <!-- 답변도 마크다운 (032-01) / Answers use Markdown too (032-01) -->
            <div class="card-text" th:utext="${commonUtil.markdown(answer.content)}"></div>
            <div class="d-flex justify-content-end">
                <!-- 답변 수정일시 (029-02) / The answer's modified date (029-02) -->
                <div th:if="${answer.modifyDate.isAfter(answer.createDate.plusSeconds(1))}"
                     class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2"><span th:if="${answer.author != null}" th:text="${answer.author.username}"></span></div>
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <!-- 답변 수정·삭제 버튼: 답변 글쓴이에게만 (029-02) / Answer edit/delete buttons: only for the answer's author (029-02) -->
            <!-- 답변 추천 버튼 (교재 3-10) / Answer recommend button (book 3-10) -->
            <form th:action="@{|/answer/vote/${answer.id}|}" method="post" class="d-inline-block mt-3">
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                    추천 <span class="badge rounded-pill bg-success" th:text="${#lists.size(answer.voter)}"></span>
                </button>
            </form>
            <div class="my-3" sec:authorize="isAuthenticated()"
                 th:if="${answer.author != null and answer.author.username == #authentication.name}">
                <a th:href="@{|/answer/modify/${answer.id}|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <form th:action="@{|/answer/delete/${answer.id}|}" th:method="delete" class="d-inline"
                      onsubmit="return confirm('정말로 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <!--
      답변 등록 폼 → POST /answer/create/{질문id}. th:object 로 AnswerForm 과 연결하고, 오류는 공통 조각으로 표시 (019-01).
      Answer form → POST /answer/create/{question id}. Tied to AnswerForm with th:object; errors shown via the shared fragment (019-01).
    -->
    <form th:action="@{|/answer/create/${question.id}|}" th:object="${answerForm}" method="post" class="my-3">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <!--
          로그인하지 않았으면 입력칸을 비활성화(disabled)해서 쓸 수 없게 한다 (교재 3-08).
          sec:authorize 로 두 가지 textarea 중 하나만 그린다.
          When not logged in, the box is disabled so nothing can be typed (book 3-08).
          sec:authorize renders only one of the two textareas.
        -->
        <textarea sec:authorize="isAnonymous()" disabled th:field="*{content}" rows="10" class="form-control"
                  placeholder="로그인 후 답변을 작성할 수 있습니다."></textarea>
        <textarea sec:authorize="isAuthenticated()" th:field="*{content}" rows="10" class="form-control"></textarea>
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
