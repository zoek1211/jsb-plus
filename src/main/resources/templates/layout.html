<!DOCTYPE html>
<!--
  모든 페이지가 공유하는 공통 틀 (교재 2-15 템플릿 상속, 14168 44~45강 레이아웃 방언).
  <head>(부트스트랩, style.css 등)를 여기 한 번만 쓰고, 각 페이지는 layout:fragment="content" 부분만 채운다.
  The shared frame every page uses (book 2-15 template inheritance, 14168 lectures 44–45 Layout Dialect).
  The <head> (Bootstrap, style.css, ...) is written once here; each page fills in only the layout:fragment="content" part.

  교재는 th:replace 로 layout 을 끼워 넣지만, 레이아웃 방언은 페이지가 layout:decorate="~{layout}" 로 "이 틀을 입는다"고 선언한다.
  The book plugs pages in with th:replace; with the Layout Dialect, a page declares "wear this frame" with layout:decorate="~{layout}".
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      layout:title-pattern: 최종 제목 = "페이지 제목 | SBB". $CONTENT_TITLE 은 각 페이지의 <title>, $LAYOUT_TITLE 은 아래 "SBB" (14168 45강).
      layout:title-pattern: final title = "page title | SBB". $CONTENT_TITLE is each page's <title>, $LAYOUT_TITLE is "SBB" below (14168 lecture 45).
    -->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">SBB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
<!-- 내비게이션 바 (navbar.html 조각) / Navigation bar (the navbar.html fragment) -->
<nav th:replace="~{navbar :: navbarFragment}"></nav>
<!-- 각 페이지의 layout:fragment="content" 내용이 이 자리에 들어간다 / Each page's layout:fragment="content" goes here -->
<th:block layout:fragment="content"></th:block>
<!--
  부트스트랩 자바스크립트: 햄버거 메뉴 펼치기 같은 "움직이는" 기능에 필요하다 (CSS 만으로는 동작하지 않음).
  Bootstrap's JavaScript: needed for interactive parts like expanding the hamburger menu (CSS alone can't do it).
-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
