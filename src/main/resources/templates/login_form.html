<!DOCTYPE html>
<!--
  로그인 화면 (교재 3-07). POST /user/login 으로 username, password 를 보내면 스프링 시큐리티가 처리한다.
  The login page (book 3-07). Sending username and password to POST /user/login is handled by Spring Security.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>로그인</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <form th:action="@{/user/login}" method="post">
        <!--
          로그인에 실패하면 시큐리티가 /user/login?error 로 다시 보낸다. param.error 가 있으면 경고를 보여준다.
          On failure Security redirects back to /user/login?error. Show a warning when param.error is present.
        -->
        <div th:if="${param.error}">
            <div class="alert alert-danger">사용자ID 또는 비밀번호를 확인해 주세요.</div>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">사용자ID</label>
            <!-- name="username", name="password": 시큐리티가 기본으로 읽는 이름 / The names Security reads by default -->
            <input type="text" name="username" id="username" class="form-control">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" name="password" id="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
    </form>
</div>
</body>
</html>
