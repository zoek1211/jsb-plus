<!DOCTYPE html>
<!--
  질문 등록 폼 (교재 2-16). 제출하면 POST /question/create 로 subject, content 를 보낸다.
  The question form (book 2-16). Submitting sends subject and content to POST /question/create.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>질문 등록</title>
</head>
<body>
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">질문등록</h5>
    <!--
      method="post": 데이터를 "만드는" 요청은 POST (14168 7강). action 은 현재 주소(/question/create)와 같으므로 생략할 수도 있다 (14168 5강).
      method="post": requests that "create" data use POST (14168 lecture 7). The action equals the current URL (/question/create), so it could be omitted (14168 lecture 5).
    -->
    <form th:action="@{/question/create}" method="post">
        <div class="mb-3">
            <!-- label for="subject" 는 id="subject" 인 입력칸과 연결된다 (라벨을 누르면 입력칸에 커서) -->
            <!-- label for="subject" links to the input with id="subject" (clicking the label focuses the input) -->
            <label for="subject" class="form-label">제목</label>
            <input type="text" name="subject" id="subject" class="form-control">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea name="content" id="content" class="form-control" rows="10"></textarea>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
