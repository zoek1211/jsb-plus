<!DOCTYPE html>
<!--
  질문 등록 폼 (교재 2-16). 제출하면 POST /question/create 로 subject, content 를 보낸다.
  The question form (book 2-16). Submitting sends subject and content to POST /question/create.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <!-- 등록/수정에 따라 탭 제목도 바꾼다 (029-01) / The tab title also follows create/edit (029-01) -->
    <title th:text="${questionId == null} ? '질문 등록' : '질문 수정'">질문 등록</title>
</head>
<body>
<div layout:fragment="content" class="container">
    <!--
      등록과 수정이 이 폼을 함께 쓴다 (029-01). 컨트롤러가 questionId 를 넘기면 "수정" 화면.
      This form is shared by create and edit (029-01). If the controller passes questionId, it's the edit screen.
    -->
    <h5 class="my-3 border-bottom pb-2" th:text="${questionId == null} ? '질문등록' : '질문수정'"></h5>
    <!--
      th:object="${form}": 이 폼이 컨트롤러의 QuestionForm("form")과 연결된다. 안에서는 *{필드} 로 짧게 쓴다 (14168 22강).
      등록: POST /question/create, 수정: PUT /question/modify/{id}.
      th:method="put" 이면 타임리프가 method="post" 와 숨은 <input name="_method" value="put"> 을 함께 만든다 (14168 41강).
      th:object="${form}": ties this form to the controller's QuestionForm ("form"). Inside it, fields are written shortly as *{field} (14168 lecture 22).
      Create: POST /question/create, edit: PUT /question/modify/{id}.
      With th:method="put", Thymeleaf writes method="post" plus a hidden <input name="_method" value="put"> (14168 lecture 41).
    -->
    <form th:action="${questionId == null} ? @{/question/create} : @{|/question/modify/${questionId}|}"
          th:method="${questionId == null} ? 'post' : 'put'"
          th:object="${form}">
        <!--
          검증 오류 표시: 공통 조각 form_errors.html 로 바꿔 끼운다 (019-01, 교재 2-17).
          th:replace="~{파일이름 :: 조각이름}": 이 div 를 그 조각으로 통째로 교체한다.
          Validation errors: swapped in from the shared fragment form_errors.html (019-01, book 2-17).
          th:replace="~{file :: fragment}": replaces this whole div with that fragment.
        -->
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <!--
              th:field="*{subject}": name="subject", id="subject", value="(form.subject 값)" 을 한 번에 만들어 준다.
              그래서 검증에 실패해 폼을 다시 보여줄 때 입력했던 값이 그대로 남는다 (14168 10강).
              th:field="*{subject}": generates name="subject", id="subject" and value="(form.subject)" in one go.
              So when validation fails and the form is shown again, the typed value stays (14168 lecture 10).
            -->
            <input type="text" th:field="*{subject}" class="form-control">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10"></textarea>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
