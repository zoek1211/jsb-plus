<!doctype html>
<!--
  루트 컴포지션: 영상 전체의 크기·길이·색·글꼴을 정하고, 장면(sub-composition)을 하나씩 올려놓는 곳.
  The root composition: sets the whole video's size, length, colours and fonts, and mounts each scene.

  data-composition-variables: 색과 글꼴을 "변수"로 선언한다. HyperFrames 데스크톱 앱의 Variables 패널에서
  코드를 고치지 않고 바꿀 수 있다. 빼면 색을 바꿀 때마다 모든 장면 파일을 고쳐야 한다.
  Declares colours and fonts as variables, editable in the HyperFrames desktop app without touching code.
  Without it, every colour change means editing every scene file.
-->
<html
  lang="ko"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"바탕 / Ground","default":"#F6F8FA"},
    {"id":"ink","type":"color","label":"잉크 / Ink","default":"#1F2328"},
    {"id":"book","type":"color","label":"교재·실패 / Book & fail","default":"#CF222E"},
    {"id":"book-soft","type":"color","label":"교재 배경 / Book tint","default":"#FFEBE9"},
    {"id":"ours","type":"color","label":"우리·통과 / Ours & pass","default":"#1A7F37"},
    {"id":"ours-soft","type":"color","label":"우리 배경 / Ours tint","default":"#DAFBE1"},
    {"id":"line","type":"color","label":"테두리 / Border","default":"#D0D7DE"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP: 시간에 따라 값을 바꾸는 애니메이션 라이브러리. 버전을 고정해 렌더 결과가 항상 같게 한다. -->
    <!-- GSAP: the animation library. The version is pinned so every render comes out identical. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /*
        @font-face: 기본 글꼴에 한글이 없어서 프로젝트 안의 Pretendard 파일을 직접 연결한다.
        경로는 assets/... 로 쓴다 (맨 앞 / 를 붙이면 렌더 때 파일을 못 찾는다).
        @font-face: the bundled fonts lack Hangul, so we link the Pretendard files in the project.
        Paths start with assets/... (a leading / breaks the render).
      */
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");
        font-weight: 800;
      }

      /*
        SPEC.md 의 LOOK 을 CSS 변수로 옮긴 것. 빨강은 "교재·실패", 초록은 "우리·통과" 에만 쓴다.
        SPEC.md's LOOK as CSS variables. Red only for "book / failing", green only for "ours / passing".
      */
      :root {
        --ground: #f6f8fa;
        --ink: #1f2328;
        --book: #cf222e;
        --book-soft: #ffebe9;
        --ours: #1a7f37;
        --ours-soft: #dafbe1;
        --line: #d0d7de;
        --font-display: "Pretendard", sans-serif;
        /* 코드는 JetBrains Mono, 한글이 섞이면 Pretendard 로 이어서 그린다. */
        /* Code uses JetBrains Mono; Hangul inside code falls back to Pretendard. */
        --font-code: "JetBrains Mono", "Pretendard", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <!--
      data-duration: 영상 길이(초). 지금은 DB 장(S06–S10)까지 134.3 초, 장(chapter)을 더할 때마다 늘어난다.
      data-duration: the video's length in seconds. 134.3 s covers up to the DB chapter (S06–S10); it grows with each chapter.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="134.3"
      data-width="1920"
      data-height="1080"
    >
      <!--
        장면 자리(host): 장면 파일을 이 시간대에 올린다. id·data-composition-id 를 장면 파일과 똑같이("hook") 맞춰야
        렌더가 바로 장면을 찾는다 (다르면 장면마다 45 초씩 기다린다).
        Scene host: mounts the scene file for this time range. Its id and data-composition-id must match the
        scene file ("hook"), or each render waits 45 s per scene.
      -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="38.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 과제 장 (S04–S05): 훅이 끝나는 38.3 초부터 31.4 초 동안 / Assignment chapter (S04–S05): 31.4 s from 38.3 s -->
      <div
        id="project"
        data-composition-id="project"
        data-composition-src="compositions/project.html"
        data-start="38.3"
        data-duration="31.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- DB 장 ① mappedBy (S06–S07) / DB chapter ① mappedBy (S06–S07) -->
      <div
        id="db1"
        data-composition-id="db1"
        data-composition-src="compositions/db1.html"
        data-start="69.7"
        data-duration="22.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <!-- DB 장 ② 가짜 초록불 (S08) / DB chapter ② the false green (S08) -->
      <div
        id="db2"
        data-composition-id="db2"
        data-composition-src="compositions/db2.html"
        data-start="92.1"
        data-duration="16.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <!-- DB 장 ③ LAZY 와 BaseEntity (S09–S10) / DB chapter ③ LAZY and BaseEntity (S09–S10) -->
      <div
        id="db3"
        data-composition-id="db3"
        data-composition-src="compositions/db3.html"
        data-start="108.9"
        data-duration="25.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!--
        내레이션: 장면마다 mp3 하나. 문장은 장면 시작 0.4 초 뒤에 시작하고, 끝나고 0.8 초 숨을 둔다.
        <audio> 는 id 가 있어야 믹스에 들어간다.
        Narration: one mp3 per scene, starting 0.4 s into the scene with a 0.8 s breath after.
        An <audio> needs an id to be part of the mix.
      -->
      <audio id="vo-s01" src="assets/vo/S01.mp3" data-start="0.4" data-duration="7.58" data-track-index="10" data-volume="1.148154"></audio>
      <audio id="vo-s02" src="assets/vo/S02.mp3" data-start="9.2" data-duration="13.08" data-track-index="10" data-volume="1.148154"></audio>
      <audio id="vo-s03" src="assets/vo/S03.mp3" data-start="25.3" data-duration="12.17" data-track-index="10" data-volume="1.161449"></audio>
      <audio id="vo-s04" src="assets/vo/S04.mp3" data-start="38.7" data-duration="18.07" data-track-index="10" data-volume="1.188502"></audio>
      <audio id="vo-s05" src="assets/vo/S05.mp3" data-start="58" data-duration="10.85" data-track-index="10" data-volume="1.148154"></audio>
      <audio id="vo-s06" src="assets/vo/S06.mp3" data-start="70.1" data-duration="9.17" data-track-index="10" data-volume="1.122018"></audio>
      <audio id="vo-s07" src="assets/vo/S07.mp3" data-start="80.5" data-duration="10.82" data-track-index="10" data-volume="1.096478"></audio>
      <audio id="vo-s08" src="assets/vo/S08.mp3" data-start="92.5" data-duration="15.6" data-track-index="10" data-volume="1.135011"></audio>
      <audio id="vo-s09" src="assets/vo/S09.mp3" data-start="109.3" data-duration="12.67" data-track-index="10" data-volume="1.109175"></audio>
      <audio id="vo-s10" src="assets/vo/S10.mp3" data-start="123.2" data-duration="10.3" data-track-index="10" data-volume="1.148154"></audio>
    </div>
    <script>
      // paused: true — 재생하지 않고 멈춰 둔 타임라인. HyperFrames 가 프레임마다 시간을 직접 맞춰(seek) 그린다.
      // paused: true — a stopped timeline. HyperFrames seeks it to each frame's time and draws it.
      const tl = gsap.timeline({ paused: true });
      // 이 이름("main")으로 등록해야 렌더러가 타임라인을 찾는다. 빼면 애니메이션이 하나도 안 나온다.
      // Register under the composition id ("main") so the renderer finds it; without this nothing animates.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
