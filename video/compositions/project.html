      { x: 0, y: 0, scale: 1 },
      { x: -440, y: -200, scale: 0.65, duration: 0.65, ease: "power3.inOut" },
      0.3,
    );
    // 줄어든 카드에서는 제목만 남긴다: 본문·글쓴이는 0.65 배면 28px 보다 작아져 읽을 수 없다.
    // Only the title stays on the small card: at 0.65x the body and author fall under 28 px.
    tl.to(["#pj-card-body", "#pj-card-author"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 0.3);
    // 빈 아랫부분은 clip-path 로 잘라 카드가 제목 크기로 줄어든 것처럼 보이게 한다 (레이아웃 속성은 건드리지 않는다).
    // clip-path trims the empty lower half so the card reads as title-sized (no layout properties are tweened).
    tl.fromTo("#pj-card", { clipPath: "inset(0 0 0% 0 round 12px)" }, { clipPath: "inset(0 0 47% 0 round 12px)", duration: 0.4, ease: "power2.inOut" }, 0.45);
    tl.fromTo("#pj-card", { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.32, ease: "power2.in", yoyo: true, repeat: 1 }, 0.3);
    // git log 창이 오른쪽에서 들어와 선명해진다. / The git log window slides in from the right and sharpens.
    tl.fromTo(
      "#pj-logwin",
      { x: 160, opacity: 0, filter: "blur(10px)" },
      { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
      0.6,
    );
    // 처음 16줄이 한 줄씩 인쇄된다 (0.25 s 간격). / The first 16 lines print one at a time (0.25 s apart).
    tl.fromTo(
      "#pj-log .pj-log-line:nth-child(-n+16)",
      { opacity: 0, clipPath: "inset(0 100% 0 0)" },
      { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.2, ease: "power2.out", stagger: 0.25 },
      1.1,
    );
    // 왼쪽 제목: "점프 투 스프링부트" → "1장 ~ 3장," → "AI와 함께" (말하는 순서대로, 단어마다 흐림 → 선명).
    // Left title, in the order spoken, word by word blur → sharp.
    tl.fromTo("#pj-title .t1 .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.09 }, 1.0);
    tl.fromTo("#pj-title .t2 .w:nth-child(1)", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, 2.4);
    tl.fromTo("#pj-title .t2 .w:nth-child(2)", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, 3.9);
    tl.to("#pj-title", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 5.9);

    // 문장 2 "작은 작업 하나마다 커밋해서 모두 57개": 로그가 끝까지 흐르는 동안 숫자가 1 → 57.
    // onUpdate 로 글자를 바꾸지만 값은 타임라인 시간에서만 나오므로 어느 프레임이든 같은 결과다.
    // Sentence 2: the log scrolls to the end as the number runs 1 → 57.
    // onUpdate writes the text, but the value comes only from timeline time, so any frame renders the same.
    const counter = { n: 1 };
    tl.fromTo("#pj-count", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 6.1);
    tl.fromTo("#pj-count-label", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.2);
    tl.fromTo(
      counter,
      { n: 1 },
      {
        n: 57,
        duration: 3.0,
        ease: "power2.inOut",
        onUpdate: () => {
          document.querySelector("#pj-count").textContent = Math.round(counter.n);
        },
      },
      6.2,
    );
    // 57줄 x 46px, 보이는 칸 16줄 → (57 − 16) x 46 = 1886px 올라간다.
    // 57 lines x 46 px with 16 visible → it rises (57 − 16) x 46 = 1886 px.
    tl.fromTo("#pj-log", { y: 0 }, { y: -1886, duration: 3.0, ease: "power2.inOut" }, 6.2);
    // 다음 장면에서 펼쳐질 033-01 줄을 미리 초록으로 짚어 둔다.
    // Mark the 033-01 line, which unfolds in S05.
    tl.fromTo("#pj-log-hit", { backgroundColor: "rgba(218, 251, 225, 0)" }, { backgroundColor: "rgba(218, 251, 225, 1)", duration: 0.3 }, 9.4);

    // 문장 3 "교재는 스프링부트 3과 자바 17을 쓰지만, 저는 …4.1.2와 자바 25": 교재 버전 → 취소선 → 우리 버전.
    // Sentence 3: book versions → struck → ours.
    tl.fromTo("#pj-ver-book", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.17 }, 10.7);
    tl.to("#pj-ver-book-strike", { width: 368, duration: 0.27, ease: "power2.inOut" }, 13.9);
    tl.fromTo("#pj-ver-ours", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.17 }, 14.5);
    tl.to("#pj-ver-band", { width: 430, duration: 0.47, ease: "power2.inOut" }, 16.6);

    // ── S05 (19.3–31.4) ─────────────────────────────────────────
    // 033-01 줄(창 안 y ≈ 720px)에서 README 항목이 위아래로 펼쳐진다 ("물체가 다음 세계가 된다").
    // The README entry unfolds up and down from the 033-01 line (≈720 px into the window): the object becomes the next world.
    tl.to("#pj-logwin", { opacity: 0, duration: 0.25, ease: "power2.in" }, 19.4);
    tl.fromTo(
      "#pj-readmewin",
      { scaleY: 0.06, opacity: 0, transformOrigin: "50% 720px" },
      { scaleY: 1, opacity: 1, duration: 0.6, ease: "expo.out" },
      19.45,
    );
    // 항목 칸이 말에 맞춰 차례로: 작업 → 이유("왜 바꿨는지") → 결과 → 핵심 변경 → 실행화면("실제 실행 화면으로").
    // Fields land with the words: work → why → result → key change → screenshot.
    const fields = [
      ["#pj-f1", 20.3],
      ["#pj-f2", 21.6],
      ["#pj-f3", 22.5],
      ["#pj-f4", 23.2],
      ["#pj-f5", 23.9],
    ];
    fields.forEach(([sel, at]) => {
      tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.17, ease: "power2.out" }, at);
    });

    // 문장 2 "코드 파일마다 한국어와 영어로 학습용 주석도": README 가 흐려지며 빠지고 코드 창이 들어온다.
    // Sentence 2: the README blurs away and the code window arrives.
    tl.to("#pj-readmewin", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 26.2);
    tl.fromTo("#pj-codewin", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 26.4);
    // "한국어와" (≈27.5 s) → 한국어 주석, "영어로" (≈28.2 s) → 영어 주석에 초록 띠.
    // "한국어와" (≈27.5 s) → the Korean comment, "영어로" (≈28.2 s) → the English one, each gets a green band.
    tl.to("#pj-c-ko .pj-c-band", { width: "calc(100% + 20px)", duration: 0.47, ease: "power2.inOut" }, 27.4);
    tl.to("#pj-c-en .pj-c-band", { width: "calc(100% + 20px)", duration: 0.47, ease: "power2.inOut" }, 28.2);

    window.__timelines = window.__timelines || {};
    window.__timelines["project"] = tl;
  </script>
