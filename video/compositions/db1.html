    // The card settles into the question table's name row and dissolves = "saved". Tables sharpen meanwhile.

    tl.fromTo(
      "#db1-card",
      { x: 0, y: 0, scale: 1, opacity: 1 },
      { x: 80, y: 160, scale: 0.6, opacity: 0, duration: 0.7, ease: "power3.in" },

    // "빼면 어떻게 될까요?" — mappedBy 에 취소선, 흐려짐. / "Remove it?" — mappedBy struck and dimmed.

    // "A useless join table appears" — two red lines draw and the join table appears.

    tl.fromTo("#db1-qa", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 6.9);
    tl.fromTo("#db1-qa-label", hidden, blurIn, 8.0);

    // ── S07 (10.4–22.4) ──
    // 교재 줄 → 우리 줄 (흐림 교체). / Book line → our line (blur swap).

    tl.fromTo(
      "#db1-ours",
      { opacity: 0, clipPath: "inset(0 100% 0 0 round 10px)" },
      { opacity: 1, clipPath: "inset(0 0% 0 0 round 10px)", duration: 0.4, ease: "power3.out" },
      11.1,

    // The join table and red lines go; answer.question_id turns green and the foreign-key line draws.
    tl.to(["#db1-qa", "#db1-qa-label", "#db1-l1", "#db1-l2"], { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, 12.4);
    tl.fromTo("#db1-fk", { backgroundColor: "rgba(218, 251, 225, 0)" }, { backgroundColor: "rgba(218, 251, 225, 1)", duration: 0.3 }, 13.4);
    tl.fromTo("#db1-l3", { strokeDashoffset: 600 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 13.7);
    tl.fromTo("#db1-qid", { backgroundColor: "rgba(218, 251, 225, 0)" }, { backgroundColor: "rgba(218, 251, 225, 1)", duration: 0.3 }, 14.2);

    // "I made the mistake and fixed it" — the real commits: experiment (005-01) → fix (005-02).

    tl.fromTo("#db1-c2", hidden, blurIn, 17.5);
    // "왜 필요한지 분명해졌습니다" (≈19.8 s): 외래 키 선에 이름표. / The foreign-key line gets its label.
    tl.fromTo("#db1-fk-label", hidden, blurIn, 19.8);

    window.__timelines = window.__timelines || {};
